name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/vol-api
  UI_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/vol-ui

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest --cov=src --cov=api --cov-report=term-missing

  build-push:
    name: Build & push images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ui.Dockerfile
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:latest
            ${{ env.UI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  deploy:
    name: Trigger local deployment
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Call webhook through ngrok
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent --max-time 20 \
            -X POST "$WEBHOOK_URL/deploy" \
            -H "X-Webhook-Token: $WEBHOOK_TOKEN" \
            -H "ngrok-skip-browser-warning: true" \
            -H "Content-Type: application/json" \
            -d "{\"sha\": \"${{ github.sha }}\"}"
