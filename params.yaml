data:
  start_date: "2005-01-01"
  end_date: "2026-10-01"        # data v2 (exclusive). Data v1 was "2025-01-01"
  index_ticker: "^GSPC"
  vix_ticker: "^VIX"

features:
  horizon: 5                    # predict the next 5 trading days
  threshold_window: 252         # 1 trading year of history for the "high vol" threshold
  threshold_quantile: 0.75

split:
  test_size: 0.2                # last 20% of the timeline is the test set

train:
  random_state: 42
  decision_threshold: 0.5
  logreg:
    C: 0.5
  hgb:
    max_iter: 300
    learning_rate: 0.05
    max_depth: 4
    l2_regularization: 1.0

registry:
  experiment: vol-regime
  model_name: vol-regime
  alias: champion
  selection_metric: roc_auc
  reference_rows: 400
  quality_gate:
    metric: roc_auc
    min_value: 0.60
